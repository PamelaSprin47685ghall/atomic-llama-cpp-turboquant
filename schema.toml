[schema]
type = "object"
required = ["strategy"]
properties.strategy = { type = "string" }

[[schema.oneOf]]
description = "不需要 deep think，则直接续写"
properties.strategy = { const = "direct" }

[[schema.oneOf]]
description = "拆解为拓扑思维导图，则使用 DAG"
properties.strategy = { const = "dag" }
properties.payload = { "$ref" = "#/schema/$defs/DagPayload" }

[schema."$defs".DagPayload]
type = "object"
required = ["questions", "depends_on"]

[schema."$defs".DagPayload.properties]
questions = { 
  type = "array", 
  items = {
    type = "object", 
    required = ["id", "intent"],
    properties = { 
      id = { type = "string" }, 
      intent = { type = "string" } 
    }
  } 
}
depends_on = { 
  type = "array", 
  items = { 
    type = "object", 
    required = ["id", "depends_on_id"], 
    properties = { 
      id = { type = "string" },
      depends_on_id = { type = "string" }
    }
  }
}

[data]
# Production probe teacher-forces JSON opener {"strategy":" then samples.
# This scratch file keeps an empty strategy value as the same idea.
strategy = ""
